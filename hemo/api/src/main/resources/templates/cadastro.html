<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - HemogloBank</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; padding: 40px 0; }
        .card { background: white; padding: 30px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #b71c1c; margin-bottom: 20px; text-align: center; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #b71c1c; color: white; border: none; border-radius: 4px; margin-top: 20px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #9a0007; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cadastro de Doador</h2>
        <form id="form-cadastro">
            <label>Nome Completo:</label>
            <input type="text" id="nome" required>

            <label>E-mail:</label>
            <input type="email" id="email" required>

            <label>Senha:</label>
            <input type="password" id="senha" required>

            <label>CPF:</label>
            <input type="text" id="cpf" placeholder="00000000000" maxlength="11" required>

            <label>Data de Nascimento:</label>
            <input type="date" id="dataNascimento" required>

            <label>Sexo:</label>
            <select id="sexo" required>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
                <option value="Outro">Outro</option>
            </select>

            <label>Telefone:</label>
            <input type="text" id="telefone" placeholder="(11) 99999-9999" required>

            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const dataNascVal = document.getElementById('dataNascimento').value;

            const dto = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
                cpf: document.getElementById('cpf').value,
                dataNascimento: `${dataNascVal}T00:00:00`,
                sexo: document.getElementById('sexo').value,
                telefone: document.getElementById('telefone').value
            };

            try {
                const response = await fetch('/api/cadastro/doador', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dto)
                });

                if (response.ok) {
                    alert('Cadastro realizado com sucesso! Faça login para continuar.');
                    window.location.href = '/login';
                } else {
                    const msg = await response.text();
                    alert('Erro no cadastro: ' + msg);
                }
            } catch (err) {
                console.error(err);
                alert('Erro de conexão ao tentar cadastrar.');
            }
        });
    </script>
</body>
</html>
