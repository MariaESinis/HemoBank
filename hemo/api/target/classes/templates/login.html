<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Hemocentro - Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 350px; margin: 80px auto; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #cc0000; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; margin-top: 10px; }
        .error { color: red; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>Acesse sua Área</h2>
    
    <!-- Alerta caso dê erro de credenciais inválidas -->
    <div th:if="${param.error}" class="error">
        E-mail ou senha inválidos!
    </div>

    <form method="post" action="/login">
    <label>E-mail:</label>
    <input type="email" name="email" required> <!-- O name deve ser "email" -->

    <label>Senha:</label>
    <input type="password" name="password" required> <!-- O name deve ser "password" -->

    <button type="submit">Entrar</button>
</form>
    <p>Não tem conta? <a href="/hemocentro/cad">Cadastre-se</a></p>
</body>
</html>
