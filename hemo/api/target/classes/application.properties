spring.application.name=api

# Configurações do Banco em Memória H2
spring.datasource.url=jdbc:h2:mem:hemoglobankdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123

# Habilita o console web do H2 para você mexer no banco pelo navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Faz o Hibernate criar as tabelas automaticamente com base nas suas classes Java @Entity
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL no console para você acompanhar as inserções
spring.jpa.show-sql=true

# Executa o data.sql após a criação das tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always