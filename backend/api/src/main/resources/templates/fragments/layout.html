<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - HemogloBank'">HemogloBank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Topo das páginas públicas -->
<header class="topo" th:fragment="topoPublico">
    <div class="topo-inner">
        <a class="marca" th:href="@{/}"> HemogloBank</a>
        <nav>
            <a th:href="@{/}">Início</a>
            <a th:href="@{/login}">Entrar</a>
            <a th:href="@{/cadastro}">Cadastrar-se</a>
        </nav>
    </div>
</header>

<!-- Topo do doador -->
<header class="topo" th:fragment="topoDoador">
    <div class="topo-inner">
        <a class="marca" th:href="@{/doador/painel}"> HemogloBank</a>
        <nav>
            <a th:href="@{/doador/painel}">Meu painel</a>
            <a th:href="@{/doador/agendamento}">Agendar doação</a>
            <a th:href="@{/}">Estoque</a>
            <form th:action="@{/logout}" method="post"><button type="submit">Sair</button></form>
        </nav>
    </div>
</header>

<!-- Topo do médico -->
<header class="topo" th:fragment="topoMedico">
    <div class="topo-inner">
        <a class="marca" th:href="@{/medico/painel}"> HemogloBank</a>
        <span class="perfil">Área do médico</span>
        <nav>
            <a th:href="@{/medico/painel}">Painel</a>
            <a th:href="@{/}">Estoque</a>
            <form th:action="@{/logout}" method="post"><button type="submit">Sair</button></form>
        </nav>
    </div>
</header>

<!-- Topo do gestor -->
<header class="topo" th:fragment="topoGestor">
    <div class="topo-inner">
        <a class="marca" th:href="@{/gestor/painel}"> HemogloBank</a>
        <span class="perfil">Área do gestor</span>
        <nav>
            <a th:href="@{/gestor/painel}">Painel</a>
            <a th:href="@{/gestor/relatorios}">Relatórios</a>
            <a th:href="@{/}">Estoque</a>
            <form th:action="@{/logout}" method="post"><button type="submit">Sair</button></form>
        </nav>
    </div>
</header>

<!-- Mensagens de sucesso/erro (flash attributes dos controllers) -->
<div th:fragment="mensagens">
    <div class="alerta sucesso" th:if="${sucesso}" th:text="${sucesso}">Operação realizada.</div>
    <div class="alerta erro" th:if="${erro}" th:text="${erro}">Algo deu errado.</div>
</div>

<footer th:fragment="rodape">
    <p>&copy; 2026 HemogloBank - Salve vidas. Doe sangue.</p>
</footer>

</body>
</html>
