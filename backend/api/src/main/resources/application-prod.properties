# Perfil de produção: java -jar api.jar --spring.profiles.active=prod
# Exige as variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD (PostgreSQL).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false
spring.jpa.show-sql=false
# Recomendado evoluir para Flyway/Liquibase e trocar por "validate".
spring.jpa.hibernate.ddl-auto=update

# Não carrega os dados de demonstração (usuários com senha conhecida!)
spring.sql.init.mode=never
