<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<header th:replace="~{fragments/layout :: topoPublico}"></header>

<main class="container estreito">
    <section class="card">
        <h2>Acesse sua área</h2>

        <div class="alerta erro" th:if="${param.error}">E-mail ou senha inválidos.</div>
        <div class="alerta info" th:if="${param.logout}">Você saiu da sua conta.</div>
        <div class="alerta sucesso" th:if="${param.cadastro}">Cadastro realizado! Faça login para continuar.</div>

        <!-- th:action inclui automaticamente o token CSRF -->
        <form method="post" th:action="@{/login}">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" required autofocus>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit" class="btn bloco">Entrar</button>
        </form>

        <p style="margin-top: 16px; text-align: center;">
            Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a>
        </p>
    </section>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
