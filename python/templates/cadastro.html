{% extends "layout.html" %}

{% block titulo %}Cadastro de doador{% endblock %}

{% block topo %}{% include "_topo_publico.html" %}{% endblock %}

{% block conteudo %}
<main class="container estreito">
    <section class="card">
        <h2>Cadastro de doador</h2>

        <div id="mensagem" class="alerta erro" style="display: none;"></div>

        <form id="form-cadastro" novalidate>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" maxlength="120" required>
            <div class="erro-campo" data-erro="nome"></div>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" maxlength="120" autocomplete="username" required>
            <div class="erro-campo" data-erro="email"></div>

            <label for="senha">Senha (mínimo 6 caracteres)</label>
            <input type="password" id="senha" name="senha" minlength="6" maxlength="72" autocomplete="new-password" required>
            <div class="erro-campo" data-erro="senha"></div>

            <label for="cpf">CPF (somente números)</label>
            <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="00000000000" maxlength="14" required>
            <div class="erro-campo" data-erro="cpf"></div>

            <label for="dataNascimento">Data de nascimento</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
            <div class="erro-campo" data-erro="dataNascimento"></div>

            <label for="sexo">Sexo</label>
            <select id="sexo" name="sexo" required>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
                <option value="Outro">Outro</option>
            </select>
            <div class="erro-campo" data-erro="sexo"></div>

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" placeholder="(11) 99999-9999" maxlength="20" required>
            <div class="erro-campo" data-erro="telefone"></div>

            <button type="submit" class="btn bloco" id="botao">Cadastrar</button>
        </form>

        <p style="margin-top: 16px; text-align: center;">
            Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
        </p>
    </section>
</main>

<script>
    const form = document.getElementById('form-cadastro');
    const caixaMensagem = document.getElementById('mensagem');
    const botao = document.getElementById('botao');

    function limparErros() {
        caixaMensagem.style.display = 'none';
        document.querySelectorAll('[data-erro]').forEach(function (el) { el.textContent = ''; });
    }

    function mostrarMensagem(texto) {
        caixaMensagem.textContent = texto;
        caixaMensagem.style.display = 'block';
        caixaMensagem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        limparErros();

        const dto = {
            nome: document.getElementById('nome').value.trim(),
            email: document.getElementById('email').value.trim(),
            senha: document.getElementById('senha').value,
            // aceita "123.456.789-09" e envia só os dígitos
            cpf: document.getElementById('cpf').value.replace(/\D/g, ''),
            dataNascimento: document.getElementById('dataNascimento').value, // yyyy-MM-dd
            sexo: document.getElementById('sexo').value,
            telefone: document.getElementById('telefone').value.trim()
        };

        botao.disabled = true;
        try {
            const resposta = await fetch("{{ url_for('api_cadastro_doador') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dto)
            });

            if (resposta.status === 201) {
                window.location.href = "{{ url_for('login', cadastro=1) }}";
                return;
            }

            let corpo = {};
            try { corpo = await resposta.json(); } catch (_) { /* resposta sem JSON */ }

            if (corpo.campos) {
                Object.keys(corpo.campos).forEach(function (campo) {
                    const el = document.querySelector('[data-erro="' + campo + '"]');
                    if (el) el.textContent = corpo.campos[campo];
                });
            }
            mostrarMensagem(corpo.erro || 'Não foi possível concluir o cadastro.');
        } catch (err) {
            console.error(err);
            mostrarMensagem('Erro de conexão ao tentar cadastrar. Tente novamente.');
        } finally {
            botao.disabled = false;
        }
    });
</script>
{% endblock %}
